{% extends 'base.html' %}

{% block title %}Quiz Arena - {{ quiz.title }}{% endblock %}

{% block content %}
<div class="quiz-arena-container">
    <!-- Quiz Info & Timer -->
    <div class="quiz-header">
        <div>
            <h3 style="font-weight: 700;">{{ quiz.title }}</h3>
            <span class="progress-info" id="progressInfo">Question 1 of 1</span>
        </div>
        <div class="timer-box" id="timerBox">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span id="timeDisplay">30s</span>
        </div>
    </div>

    <!-- Visual Progress Bar -->
    <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progressBar"></div>
    </div>

    <!-- Active Question Card -->
    <div class="card question-card" id="questionCard">
        <div class="question-meta" id="questionMeta">MULTIPLE CHOICE</div>
        <div class="question-body" id="questionText">Question content goes here?</div>
        
        <div class="choices-list" id="choicesList">
            <!-- Choice Options injected here -->
        </div>
    </div>

    <!-- Navigation Footer -->
    <div class="quiz-footer">
        <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Previous
        </button>
        <button class="btn btn-secondary" id="skipBtn" onclick="skipQuestion()">
            Skip
        </button>
        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">
            Next
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Injected questions data
    const questions = {{ questions|tojson }};
    const totalQuestions = questions.length;
    const quizId = {{ quiz.id }};
    
    let currentIdx = 0;
    let userAnswers = {}; // Map of question.id -> selected_choice
    
    // Timer Variables
    const SECONDS_PER_QUESTION = 45;
    let timerInterval = null;
    let timeLeft = SECONDS_PER_QUESTION;

    document.addEventListener('DOMContentLoaded', () => {
        if (totalQuestions > 0) {
            renderQuestion(currentIdx);
            startTimer();
        } else {
            document.getElementById('questionCard').innerHTML = `<p style="text-align:center; padding: 24px; color: var(--text-muted);">No questions available in this quiz.</p>`;
        }
    });

    function renderQuestion(index) {
        const q = questions[index];
        
        // Progress Info
        document.getElementById('progressInfo').textContent = `Question ${index + 1} of ${totalQuestions}`;
        
        // Progress Bar
        const percent = ((index + 1) / totalQuestions) * 100;
        document.getElementById('progressBar').style.width = `${percent}%`;

        // Question Type Tag
        const metaEl = document.getElementById('questionMeta');
        if (q.type === 'MCQ') {
            metaEl.textContent = 'Multiple Choice';
        } else if (q.type === 'TF') {
            metaEl.textContent = 'True / False';
        } else if (q.type === 'FIB') {
            metaEl.textContent = 'Fill in the Blank';
        }

        // Question Text
        document.getElementById('questionText').textContent = q.question_text;

        // Choices List
        const listEl = document.getElementById('choicesList');
        listEl.innerHTML = '';
        
        q.choices.forEach((choice, i) => {
            const letter = q.type === 'TF' ? '' : chr(65 + i);
            const isSelected = userAnswers[q.id] === (q.type === 'TF' ? choice : chr(65 + i));
            
            const optionEl = document.createElement('div');
            optionEl.className = `choice-option ${isSelected ? 'selected' : ''}`;
            
            // For true/false we don't display A/B/C/D prefixes, otherwise we do
            let letterPrefix = '';
            if (q.type !== 'TF') {
                letterPrefix = `<div class="choice-letter">${letter}</div>`;
            }
            
            optionEl.innerHTML = `
                ${letterPrefix}
                <div class="choice-text">${choice}</div>
            `;
            
            optionEl.onclick = () => selectChoice(q.id, q.type === 'TF' ? choice : letter, optionEl);
            listEl.appendChild(optionEl);
        });

        // Navigation state
        document.getElementById('prevBtn').disabled = (index === 0);
        
        const nextBtn = document.getElementById('nextBtn');
        if (index === totalQuestions - 1) {
            nextBtn.innerHTML = `
                Submit Quiz
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            `;
        } else {
            nextBtn.innerHTML = `
                Next
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            `;
        }
        
        // Reset and restart timer for this question
        resetTimer();
    }

    function selectChoice(questionId, choiceVal, element) {
        userAnswers[questionId] = choiceVal;
        
        // Remove 'selected' from siblings and add to this element
        document.querySelectorAll('.choice-option').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
    }

    function nextQuestion() {
        if (currentIdx === totalQuestions - 1) {
            submitQuiz();
        } else {
            currentIdx++;
            renderQuestion(currentIdx);
        }
    }

    function prevQuestion() {
        if (currentIdx > 0) {
            currentIdx--;
            renderQuestion(currentIdx);
        }
    }

    function skipQuestion() {
        // Record skipped (null or empty string)
        const q = questions[currentIdx];
        if (!userAnswers[q.id]) {
            userAnswers[q.id] = "";
        }
        nextQuestion();
    }

    // Timer Logic
    function startTimer() {
        const timerBox = document.getElementById('timerBox');
        timeLeft = SECONDS_PER_QUESTION;
        document.getElementById('timeDisplay').textContent = `${timeLeft}s`;
        
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timeDisplay').textContent = `${timeLeft}s`;
            
            if (timeLeft <= 10) {
                timerBox.classList.add('critical');
            } else {
                timerBox.classList.remove('critical');
            }
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                skipQuestion(); // Skip automatically when timer ends
            }
        }, 1000);
    }

    function resetTimer() {
        clearInterval(timerInterval);
        document.getElementById('timerBox').classList.remove('critical');
        startTimer();
    }

    // Submit payload to server
    function submitQuiz() {
        // Stop timer
        clearInterval(timerInterval);

        // Pre-submit confirmations if any skipped
        let unansweredCount = 0;
        questions.forEach(q => {
            if (!userAnswers[q.id]) {
                unansweredCount++;
                userAnswers[q.id] = ""; // Fill missing answers
            }
        });

        if (unansweredCount > 0) {
            if (!confirm(`You have ${unansweredCount} unanswered questions. Submit anyway?`)) {
                startTimer();
                return;
            }
        }

        // Show a quick client-side loading visual on nextBtn
        const nextBtn = document.getElementById('nextBtn');
        nextBtn.disabled = true;
        nextBtn.innerHTML = 'Submitting...';

        fetch(`/quiz/${quizId}/submit`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ answers: userAnswers })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success && data.attempt_id) {
                window.location.href = `/attempt/${data.attempt_id}`;
            } else {
                alert('An error occurred submitting the quiz. Please try again.');
                nextBtn.disabled = false;
                startTimer();
            }
        })
        .catch(err => {
            console.error('Submit Error:', err);
            alert('A network error occurred. Please check connection and try again.');
            nextBtn.disabled = false;
            startTimer();
        });
    }

    // Helper: Python equivalent of chr() in Javascript
    function chr(code) {
        return String.fromCharCode(code);
    }
</script>
{% endblock %}
